name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a change in pg_ducklake main (e.g. new error wording) turns the 18-main leg red.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned release (what users run) and upstream main (early warning).
        image: ["pgducklake/pgducklake:18-v1.0.2", "pgducklake/pgducklake:18-main"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 25 matches DataGrip's bundled runtime; the jar itself targets --release 17.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Unit and container tests
        env:
          IMAGE: ${{ matrix.image }}
        run: mvn -B -ntp verify "-Dducklake.image=$IMAGE"

  actions-security:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
